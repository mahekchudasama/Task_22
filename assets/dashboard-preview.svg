<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dfe6ea"/>
      <stop offset="100%" stop-color="#c7d1d8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" rx="18" fill="url(#wall)"/>

  <!-- grid board -->
  <g stroke="#aab6bd" stroke-width="1.5">
    <line x1="60" y1="60" x2="60" y2="460"/>
    <line x1="200" y1="40" x2="200" y2="480"/>
    <line x1="340" y1="60" x2="340" y2="460"/>
    <line x1="480" y1="40" x2="480" y2="480"/>
    <line x1="620" y1="60" x2="620" y2="460"/>
    <line x1="740" y1="40" x2="740" y2="480"/>
    <line x1="40" y1="90" x2="760" y2="90"/>
    <line x1="40" y1="180" x2="760" y2="180"/>
    <line x1="40" y1="270" x2="760" y2="270"/>
    <line x1="40" y1="360" x2="760" y2="360"/>
    <line x1="40" y1="440" x2="760" y2="440"/>
  </g>

  <!-- sticky notes -->
  <g>
    <rect x="80" y="70" width="100" height="80" rx="4" fill="#fef08a" transform="rotate(-3 130 110)"/>
    <rect x="220" y="100" width="100" height="80" rx="4" fill="#bbf7d0" transform="rotate(2 270 140)"/>
    <rect x="360" y="70" width="100" height="80" rx="4" fill="#bfdbfe" transform="rotate(-2 410 110)"/>
    <rect x="500" y="100" width="100" height="80" rx="4" fill="#fecaca" transform="rotate(3 550 140)"/>
    <rect x="640" y="70" width="90" height="80" rx="4" fill="#fef08a" transform="rotate(-4 685 110)"/>

    <rect x="80" y="200" width="100" height="80" rx="4" fill="#bfdbfe" transform="rotate(2 130 240)"/>
    <rect x="220" y="190" width="100" height="80" rx="4" fill="#fecaca" transform="rotate(-3 270 230)"/>
    <rect x="360" y="200" width="100" height="80" rx="4" fill="#fef08a" transform="rotate(3 410 240)"/>
    <rect x="500" y="190" width="100" height="80" rx="4" fill="#bbf7d0" transform="rotate(-2 550 230)"/>

    <rect x="150" y="300" width="100" height="80" rx="4" fill="#fecaca" transform="rotate(-2 200 340)"/>
    <rect x="290" y="310" width="100" height="80" rx="4" fill="#bfdbfe" transform="rotate(3 340 350)"/>
    <rect x="430" y="300" width="100" height="80" rx="4" fill="#bbf7d0" transform="rotate(-3 480 340)"/>
  </g>

  <!-- lines of "text" on a few notes for texture -->
  <g stroke="#00000022" stroke-width="3" stroke-linecap="round">
    <line x1="95" y1="95" x2="160" y2="95"/>
    <line x1="95" y1="112" x2="150" y2="112"/>
    <line x1="235" y1="125" x2="300" y2="125"/>
    <line x1="235" y1="142" x2="285" y2="142"/>
  </g>

  <!-- pins on notes -->
  <g fill="#ef4444">
    <circle cx="130" cy="72" r="5"/>
    <circle cx="270" cy="102" r="5"/>
    <circle cx="410" cy="72" r="5"/>
    <circle cx="550" cy="102" r="5"/>
  </g>

  <!-- forearm + hand pinning a note (bottom-left area) -->
  <g>
    <path d="M40 520 C 90 470 140 440 190 400 C 220 378 250 365 280 360 L 320 400 C 290 415 255 430 220 455 C 170 490 120 520 80 520 Z" fill="#8a5a3c"/>
    <path d="M180 405 C 210 385 240 372 270 366" stroke="#6e4429" stroke-width="10" fill="none" stroke-linecap="round"/>
    <!-- sleeve -->
    <path d="M40 520 C 70 480 100 455 130 435 L 170 470 C 140 495 100 520 70 520 Z" fill="#232323"/>
    <!-- watch -->
    <rect x="150" y="430" width="26" height="14" rx="3" fill="#111111" transform="rotate(-32 163 437)"/>
    <!-- fingers pinching a pin -->
    <ellipse cx="300" cy="345" rx="10" ry="14" fill="#8a5a3c" transform="rotate(30 300 345)"/>
  </g>

  <!-- soft vignette corners -->
  <rect width="800" height="520" rx="18" fill="#000000" opacity="0.03"/>
</svg>
